# Analysis parameters
threads: 8
window_size: 5000000
max_filter_length: 1000  # Maximum fragment length to keep in bam and bed files

# Fragment length definitions
frag_length:
  low: 90
  high: 220
  cutpoint: 150

# End motif parameters
motif_length: 4  # Length of end motifs to analyze

# Name pattern in bam files
bam_name_pattern: "{library}_aligned_dedup.bam"

# Directory roots
# Internal output directories (beds, counts, derived reference data, logs,
# benchmarks, etc.) are created beneath output_folder by the Snakefile and do not
# need to be configured.
directories:
  output_folder: "/mnt/data/urine/analysis"
  input_bams: "/mnt/data/urine/bams/dedup"
  reference: "/mnt/data/scripts/frag/ref"

# Reference files
# Filenames below are resolved relative to directories.reference.
# This directory is treated as input-only; derived reference files are written
# beneath directories.output_folder/reference_data.
references:
  # Libraries file is a tab-separated file with columns library and cohort.
  # One of the cohorts must be 'healthy'.
  libraries_file: "libraries.txt"
  genome_fasta: "GRCh38.p13.genome.fa"
  blacklist: "hg38-blacklist.v2.bed.gz"
  cytobands: "cytoBand.txt"
